name: Source module coverage guard (no deployment)
on:
  push:
    branches: [revival/source-load-coverage]
  pull_request:
    branches: [lineage-23.2, revival/prebuilt-contracts]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            tools
            tests
      - run: python3 -m unittest discover -s tests -p 'test_module_coverage.py' -v
